name: Build, Scan, Push and Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Set image tag
        id: vars
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERNAME }}
          password: ${{ secrets.DOCKERTOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ secrets.APP_DOMAIN }}/api
          tags: |
            ${{ secrets.DOCKERNAME }}/examen-devops-front:latest
            ${{ secrets.DOCKERNAME }}/examen-devops-front:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Get runner public IP
        id: runner_ip
        run: echo "ip=$(curl -s https://api.ipify.org)" >> "$GITHUB_OUTPUT"

      - name: Whitelist runner IP for SSH
        run: |
          SG_ID=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=examen-devops-sg-server" --query 'SecurityGroups[0].GroupId' --output text)
          echo "SG_ID=$SG_ID" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress --group-id "$SG_ID" --protocol tcp --port 22 --cidr "${{ steps.runner_ip.outputs.ip }}/32"

      - name: Deploy to the server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            IMAGE="${{ secrets.DOCKERNAME }}/examen-devops-front:${{ needs.build-and-push.outputs.tag }}"
            CONTAINER="examen-front"
            MARKER="/opt/app/${CONTAINER}.current_tag"
            sudo mkdir -p /opt/app
            sudo chown ubuntu:ubuntu /opt/app

            PREV_TAG=""
            if [ -f "$MARKER" ]; then
              PREV_TAG=$(cat "$MARKER")
            fi

            docker pull "$IMAGE"
            docker rm -f "$CONTAINER" 2>/dev/null || true
            docker run -d --name "$CONTAINER" --restart unless-stopped \
              --network platform \
              -e NEXT_PUBLIC_API_URL="https://${{ secrets.APP_DOMAIN }}/api" \
              --label "traefik.enable=true" \
              --label "traefik.http.routers.app-front.rule=Host(\`${{ secrets.APP_DOMAIN }}\`)" \
              --label "traefik.http.routers.app-front.entrypoints=websecure" \
              --label "traefik.http.routers.app-front.tls.certresolver=letsencrypt" \
              --label "traefik.http.routers.app-front.priority=1" \
              --label "traefik.http.services.app-front.loadbalancer.server.port=3000" \
              "$IMAGE"

            HEALTHY="false"
            for i in 1 2 3 4 5; do
              sleep 3
              CODE=$(docker exec "$CONTAINER" wget -qO- -T 2 --server-response http://127.0.0.1:3000 2>&1 | grep "HTTP/" | awk '{print $2}' || echo "000")
              if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 400 ]; then
                HEALTHY="true"
                break
              fi
            done

            if [ "$HEALTHY" = "true" ]; then
              echo "${{ needs.build-and-push.outputs.tag }}" > "$MARKER"
              echo "Deployment succeeded"
            else
              echo "Health check failed, rolling back"
              docker rm -f "$CONTAINER" 2>/dev/null || true
              if [ -n "$PREV_TAG" ]; then
                docker run -d --name "$CONTAINER" --restart unless-stopped \
                  --network platform \
                  -e NEXT_PUBLIC_API_URL="https://${{ secrets.APP_DOMAIN }}/api" \
                  --label "traefik.enable=true" \
                  --label "traefik.http.routers.app-front.rule=Host(\`${{ secrets.APP_DOMAIN }}\`)" \
                  --label "traefik.http.routers.app-front.entrypoints=websecure" \
                  --label "traefik.http.routers.app-front.tls.certresolver=letsencrypt" \
                  --label "traefik.http.routers.app-front.priority=1" \
                  --label "traefik.http.services.app-front.loadbalancer.server.port=3000" \
                  "${{ secrets.DOCKERNAME }}/examen-devops-front:$PREV_TAG"
                echo "Rolled back to $PREV_TAG"
              fi
              exit 1
            fi

      - name: Revoke runner IP SSH access
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$SG_ID" --protocol tcp --port 22 --cidr "${{ steps.runner_ip.outputs.ip }}/32"
